<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS4 Jailbreak</title>
<style>
  html, body { min-height:100%; margin:0; background:#080d12; color:#e1ebe6;
    font:15px/1.55 Consolas, "Liberation Mono", Menlo, monospace; }
  body { background-image:radial-gradient(circle at 50% 15%, #17272a 0, #080d12 58%); }
  main { box-sizing:border-box; display:flex; flex-direction:column; align-items:center;
    justify-content:center; width:100%; min-height:100vh; margin:0; padding:48px 24px;
    text-align:center; }
  h1 { margin:0 0 8px; font-size:27px; line-height:1.25; font-weight:700; }
  h1::before { content:"> "; color:#87dda5; }
  #det { margin:0 0 24px; color:#a4b9ae; }
  #det strong { color:#eff9f2; }
  button { display:block; width:100%; max-width:440px; min-height:58px; padding:12px 18px;
    border:1px solid #7ed9a1; border-radius:5px; background:#193529; color:#d9f9e4;
    font:700 17px/1.35 Consolas, "Liberation Mono", Menlo, monospace; cursor:pointer; }
  button::before { content:"> "; color:#93eab2; }
  button:focus { outline:2px solid #c9f8d8; outline-offset:3px; }
  button:active { background:#285c3e; }
  button:disabled { opacity:.7; cursor:default; }
  #progress-area { display:none; width:100%; max-width:700px; margin-top:26px; }
  #progress-head { display:flex; justify-content:space-between; margin-bottom:9px;
    color:#a9c4b3; font-size:13px; }
  #progress-track { height:12px; overflow:hidden; background:#1f3029;
    border:1px solid #395341; border-radius:3px; }
  #progress-fill { width:0; height:100%; background:#81e5a1; transition:width .35s ease; }
  #state { width:100%; max-width:700px; margin:24px 0 0; min-height:24px;
    color:#c0d3c6; }
  #state.ok { color:#8ce3aa; } #state.bad { color:#eeaaa2; }
  #result { max-width:700px; margin:12px 0 0; color:#a4b9ae; font-size:13px; }
  #cache { width:100%; max-width:700px; margin:26px 0 0; padding-top:14px;
    border-top:1px solid #294037;
    color:#7fa08d; font-size:12px; }
  #cache:empty, #result:empty { display:none; }
  #cache::before { content:"CACHE  "; color:#8fbe9d; }
  #msg, #out { display:none; }
  body.log #out { box-sizing:border-box; display:block; width:100%; max-width:700px;
    margin:20px 0 0; padding:12px; max-height:45vh; text-align:left;
    overflow:auto; white-space:pre-wrap; background:#08100d; border:1px solid #395341;
    border-radius:4px; font:12px/1.5 Consolas, "Liberation Mono", Menlo, monospace; }
  #out .ok { color:#8ce3aa; } #out .bad { color:#eeaaa2; }
  #out .warn { color:#e4bd68; }
  @media (max-width:600px) { main { padding:42px 24px; }
    h1 { font-size:23px; } }
</style>
</head>
<body>
  <main>
    <h1>PS4 Jailbreak</h1>
    <p id="det"></p>
    <button id="start" type="button" disabled>Loading...</button>
    <div id="progress-area" aria-live="polite">
      <div id="progress-head"><span id="stage">Preparing...</span><span id="percent">0%</span></div>
      <div id="progress-track" role="progressbar" aria-label="Jailbreak progress"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
    </div>
    <p id="state" role="status">Ready to start.</p>
    <p id="result"></p>
    <p id="cache"></p>
    <div id="msg"></div>
    <div id="out"></div>
  </main>
  <script type="module">
    import { startJailbreak } from "./jb.js?v=21";

    const params = new URLSearchParams(location.search);
    const startButton = document.getElementById("start");
    const stateEl = document.getElementById("state");
    const detEl = document.getElementById("det");
    const cacheEl = document.getElementById("cache");
    const resultEl = document.getElementById("result");
    const progressArea = document.getElementById("progress-area");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const stageEl = document.getElementById("stage");
    const percentEl = document.getElementById("percent");
    const supportedFirmwares = { 1302:1, 1304:1, 1350:1, 1352:1 };
    let running = false;
    let progress = 0;

    const match = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    let firmware = "unknown";
    let firmwareNumber = null;
    if (match) {
      let minor = parseInt(match[2], 16).toString(16);
      if (minor.length < 2) minor = "0" + minor;
      firmware = match[1] + "." + minor;
      firmwareNumber = parseInt(match[1], 10) * 100 + parseInt(minor, 10);
    }
    const supported = params.get("force") === "1" || supportedFirmwares[firmwareNumber] === 1;
    detEl.innerHTML = "Firmware <strong>" + firmware + "</strong> · " +
      (supported ? "supported" : "not listed in this build");
    if (!supported) {
      startButton.textContent = "Run anyway";
      stateEl.textContent = "Check the firmware before starting.";
    } else startButton.textContent = "Start";

    // These percentages denote completed stages, not elapsed time.
    const milestones = {
      "BUILD": [5, "Preparing"],
      "PRIMITIVE-OK": [20, "Initial access complete"],
      "BASES": [30, "Checking modules"],
      "JB-PROBE": [35, "Checking console state"],
      "PR-LEAK": [42, "Reading memory"],
      "PR-PASSB": [55, "Validating access"],
      "KF-WRITE": [67, "Preparing kernel"],
      "KRW-VERDICT": [78, "Kernel access verified"],
      "JB-ROOT": [85, "Applying jailbreak"],
      "KPATCH-COPY": [91, "Applying patches"],
      "PAYLOAD-RUN": [96, "Starting payload"]
    };
    function setProgress(value, label) {
      if (value < progress) return;
      progress = value;
      progressArea.style.display = "block";
      progressFill.style.width = value + "%";
      progressTrack.setAttribute("aria-valuenow", String(value));
      progressTrack.setAttribute("aria-valuetext", label);
      stageEl.textContent = label;
      percentEl.textContent = value + "%";
      stateEl.textContent = label + "...";
    }
    window.jbUi = {
      progress: function (tag) {
        if (milestones[tag]) setProgress(milestones[tag][0], milestones[tag][1]);
        if (tag === "RETRY-NEEDED") resultEl.textContent = "Refresh the page before trying again.";
      },
      finish: function (ok, armed, alreadyUnlocked) {
        running = false;
        startButton.blur();
        startButton.style.display = "none";
        if (alreadyUnlocked) {
          setProgress(100, "Already unlocked");
          stateEl.textContent = "Kernel jailbreak already active.";
          stateEl.className = "ok";
          resultEl.textContent = ok
            ? "Kernel exploit skipped. Payload started."
            : params.get("relaunch") === "1" && params.get("payload") !== "0"
              ? "Kernel exploit skipped. Payload relaunch did not complete."
              : "Kernel exploit and payload launch skipped.";
        } else if (ok) {
          setProgress(100, "Complete");
          stateEl.textContent = "Complete.";
          stateEl.className = "ok";
          resultEl.textContent = "The payload has started.";
        } else {
          stateEl.textContent = "Could not complete.";
          stateEl.className = "bad";
          if (!resultEl.textContent)
            resultEl.textContent = armed
              ? "Restart the console before trying again."
              : "Refresh the page before trying again.";
        }
      }
    };
    startButton.addEventListener("click", function () {
      if (running || startButton.disabled) return;
      running = true;
      startButton.disabled = true;
      startButton.textContent = "Running...";
      stateEl.className = "";
      resultEl.textContent = "";
      setProgress(2, "Starting");
      // Let the button and progress bar paint before the heavy browser stage.
      if (window.requestAnimationFrame)
        window.requestAnimationFrame(function () { setTimeout(startJailbreak, 80); });
      else setTimeout(startJailbreak, 80);
    });
    startButton.disabled = false;
    startButton.focus();

    const cache = window.applicationCache;
    if (cache) {
      const showCache = function (message) { cacheEl.textContent = message; };
      if (!navigator.onLine) showCache("Offline mode: using cached files.");
      else if (cache.status === cache.IDLE) showCache("Available offline.");
      else if (cache.status === cache.DOWNLOADING) showCache("Saving files for offline use...");
      else showCache("Checking offline cache...");
      cache.addEventListener("downloading", function () { showCache("Saving files for offline use..."); });
      cache.addEventListener("progress", function (event) {
        if (event && event.total) showCache("Offline cache: " + Math.round(event.loaded / event.total * 100) + "%");
      });
      cache.addEventListener("cached", function () { showCache("Available offline."); });
      cache.addEventListener("noupdate", function () { showCache("Available offline."); });
      cache.addEventListener("updateready", function () {
        try { cache.swapCache(); } catch (error) {}
        showCache("Update saved. The new version will be available on your next visit.");
      });
      cache.addEventListener("error", function () { showCache("Offline cache unavailable."); });
      cache.addEventListener("obsolete", function () { showCache("Offline cache unavailable."); });
    }
  </script>
</body>
</html>
