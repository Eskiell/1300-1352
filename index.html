<!doctype html>
<html lang="pt-BR" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jailbreak PS4</title>
  <style>
    html, body { min-height:100%; margin:0; background:#0b0d10; color:#e6ebf2;
      font:16px/1.5 "Segoe UI", Arial, sans-serif; }
    main { box-sizing:border-box; width:100%; max-width:560px; margin:10vh auto 0; padding:24px; }
    .panel { padding:28px; background:#111720; border:1px solid #293543; border-radius:12px; }
    h1 { margin:0 0 8px; font-size:27px; line-height:1.2; }
    #det { margin:0 0 22px; color:#a5b2c1; }
    #det strong { color:#e6ebf2; }
    button { display:block; width:100%; min-height:58px; padding:12px 18px; border:0;
      border-radius:8px; background:#7fd0a0; color:#0b1711; font:700 18px Arial, sans-serif;
      cursor:pointer; }
    button:focus { outline:3px solid #d6f5e2; outline-offset:3px; }
    button:disabled { opacity:.6; cursor:default; }
    #progress-area { display:none; margin-top:24px; }
    #progress-head { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px;
      color:#dce6ef; font-size:14px; }
    #progress-track { height:14px; overflow:hidden; border-radius:7px; background:#283440; }
    #progress-fill { width:0; height:100%; border-radius:7px; background:#7fd0a0;
      transition:width .35s ease; }
    #state { margin:14px 0 0; min-height:24px; color:#b9c6d4; }
    #state.ok { color:#7fd0a0; } #state.bad { color:#e59b91; }
    #cache { margin:16px 0 0; color:#8795a5; font-size:13px; }
    #result { margin:12px 0 0; color:#a5b2c1; font-size:14px; }
    #msg { display:none; }
    #out { display:none; }
    body.log #out { display:block; margin:20px 0 0; padding:12px; max-height:45vh;
      overflow:auto; white-space:pre-wrap; background:#0b0d10; border:1px solid #293543;
      border-radius:7px; font:12px/1.5 monospace; }
    #out .ok { color:#7fd0a0; } #out .bad { color:#e59b91; }
    #out .warn { color:#d8c07f; }
    @media (max-width:600px) { main { margin:20px auto 0; padding:14px; }
      .panel { padding:22px; } h1 { font-size:24px; } }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <h1>Jailbreak PS4</h1>
      <p id="det"></p>
      <button id="start" type="button" disabled>Carregando...</button>
      <div id="progress-area" aria-live="polite">
        <div id="progress-head"><span id="stage">Preparando...</span><span id="percent">0%</span></div>
        <div id="progress-track" role="progressbar" aria-label="Progresso do jailbreak"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
      </div>
      <p id="state" role="status">Pronto para iniciar.</p>
      <p id="result"></p>
      <p id="cache"></p>
      <div id="msg"></div>
      <div id="out"></div>
    </div>
  </main>
  <script type="module">
    import { startJailbreak } from "./jb.js?v=20";

    const params = new URLSearchParams(location.search);
    const startButton = document.getElementById("start");
    const stateEl = document.getElementById("state");
    const detEl = document.getElementById("det");
    const cacheEl = document.getElementById("cache");
    const resultEl = document.getElementById("result");
    const progressArea = document.getElementById("progress-area");
    const progressTrack = document.getElementById("progress-track");
    const progressFill = document.getElementById("progress-fill");
    const stageEl = document.getElementById("stage");
    const percentEl = document.getElementById("percent");
    const supportedFirmwares = { 1302:1, 1304:1, 1350:1, 1352:1 };
    let running = false;
    let progress = 0;

    const match = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    let firmware = "desconhecido";
    let firmwareNumber = null;
    if (match) {
      let minor = parseInt(match[2], 16).toString(16);
      if (minor.length < 2) minor = "0" + minor;
      firmware = match[1] + "." + minor;
      firmwareNumber = parseInt(match[1], 10) * 100 + parseInt(minor, 10);
    }
    const supported = params.get("force") === "1" || supportedFirmwares[firmwareNumber] === 1;
    detEl.innerHTML = "Firmware <strong>" + firmware + "</strong> · " +
      (supported ? "compatível" : "não listado nesta versão");
    if (!supported) {
      startButton.textContent = "Executar mesmo assim";
      stateEl.textContent = "Confira o firmware antes de iniciar.";
    } else startButton.textContent = "Iniciar";

    // These percentages denote completed stages, not elapsed time.
    const milestones = {
      "BUILD": [5, "Preparando"],
      "PRIMITIVE-OK": [20, "Acesso inicial concluído"],
      "BASES": [30, "Verificando módulos"],
      "PR-LEAK": [42, "Lendo memória"],
      "PR-PASSB": [55, "Validando acesso"],
      "KF-WRITE": [67, "Preparando kernel"],
      "KRW-VERDICT": [78, "Acesso ao kernel verificado"],
      "JB-ROOT": [85, "Aplicando jailbreak"],
      "KPATCH-COPY": [91, "Aplicando patches"],
      "PAYLOAD-RUN": [96, "Iniciando payload"]
    };
    function setProgress(value, label) {
      if (value < progress) return;
      progress = value;
      progressArea.style.display = "block";
      progressFill.style.width = value + "%";
      progressTrack.setAttribute("aria-valuenow", String(value));
      progressTrack.setAttribute("aria-valuetext", label);
      stageEl.textContent = label;
      percentEl.textContent = value + "%";
      stateEl.textContent = label + "...";
    }
    window.jbUi = {
      progress: function (tag) {
        if (milestones[tag]) setProgress(milestones[tag][0], milestones[tag][1]);
        if (tag === "RETRY-NEEDED") resultEl.textContent = "Atualize a página antes de tentar novamente.";
      },
      finish: function (ok, armed) {
        running = false;
        if (ok) {
          setProgress(100, "Concluído");
          stateEl.textContent = "Concluído.";
          stateEl.className = "ok";
          resultEl.textContent = "O payload foi iniciado.";
        } else {
          stateEl.textContent = "Não foi possível concluir.";
          stateEl.className = "bad";
          if (!resultEl.textContent)
            resultEl.textContent = armed
              ? "Reinicie o console antes de tentar novamente."
              : "Atualize a página antes de tentar novamente.";
        }
      }
    };
    startButton.addEventListener("click", function () {
      if (running || startButton.disabled) return;
      running = true;
      startButton.disabled = true;
      startButton.textContent = "Executando...";
      stateEl.className = "";
      resultEl.textContent = "";
      setProgress(2, "Iniciando");
      startJailbreak();
    });
    startButton.disabled = false;
    startButton.focus();

    const cache = window.applicationCache;
    if (cache) {
      const showCache = function (message) { cacheEl.textContent = message; };
      if (!navigator.onLine) showCache("Modo offline: arquivos em cache.");
      else if (cache.status === cache.IDLE) showCache("Disponível offline.");
      else if (cache.status === cache.DOWNLOADING) showCache("Salvando arquivos para uso offline...");
      else showCache("Verificando cache offline...");
      cache.addEventListener("downloading", function () { showCache("Salvando arquivos para uso offline..."); });
      cache.addEventListener("progress", function (event) {
        if (event && event.total) showCache("Cache offline: " + Math.round(event.loaded / event.total * 100) + "%");
      });
      cache.addEventListener("cached", function () { showCache("Disponível offline."); });
      cache.addEventListener("noupdate", function () { showCache("Disponível offline."); });
      cache.addEventListener("updateready", function () {
        try { cache.swapCache(); } catch (error) {}
        showCache("Atualização salva. A nova versão estará disponível na próxima visita.");
      });
      cache.addEventListener("error", function () { showCache("Cache offline indisponível."); });
      cache.addEventListener("obsolete", function () { showCache("Cache offline indisponível."); });
    }
  </script>
</body>
</html>
